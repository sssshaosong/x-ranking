name = "x-ranking"
main = "src/index.ts"
compatibility_date = "2026-01-01"
keep_vars = true

# Dashboard remains the source of truth for secrets and the existing D1 database.
# During Cloudflare Workers Builds, scripts/prepare-cloudflare-config.mjs resolves
# that existing D1 and generates the ephemeral deploy config.
#
# The deploy config installs one base Cron Trigger: every minute. The Worker does
# not collect every minute; src/settings.ts uses D1 settings from /admin to decide
# whether the configured interval is due. This makes scheduling editable in-app.
