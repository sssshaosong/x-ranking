name = "x-ranking"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Dashboard is the source of truth for runtime settings.
# keep_vars preserves variables configured manually in Cloudflare Dashboard.
keep_vars = true

# D1 is intentionally NOT declared here.
# In Cloudflare Workers Builds, scripts/prepare-cloudflare-config.mjs resolves
# the already-existing D1 database and injects its UUID into this file only
# inside the ephemeral CI workspace before `wrangler deploy` runs.
# This prevents Wrangler automatic resource provisioning from creating a DB.
#
# Cron is also intentionally omitted. When triggers/crons are undefined,
# Wrangler leaves the currently deployed Cron Triggers in place.
